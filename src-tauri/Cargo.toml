[package]
name = "sf-org-launcher"
version = "1.0.0"
description = "Quick access to your Salesforce orgs — lives in the system tray"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
# native-tls → Windows SChannel, so corporate TLS-inspection root CAs are trusted
reqwest = { version = "0.12", features = ["json"] }
tokio = { version = "1", features = ["net", "io-util", "time", "sync", "macros"] }
aes-gcm = "0.10"
sha2 = "0.10"
base64 = "0.22"
hex = "0.4"
rand = "0.8"
url = "2"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
dirs = "5"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "ico"] }

[target.'cfg(windows)'.dependencies]
winreg = "0.52"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
