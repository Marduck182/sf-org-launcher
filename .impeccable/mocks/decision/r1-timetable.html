<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Archivo+Narrow:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bed:#E2A92E;--slate:rgba(37,37,38,.8);--ivory:#F6F0DC;--carbon:#1E1E1E;--verm:#E2452C;--bottle:#2F7A4F;--size:14px}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:620px;height:520px;overflow:hidden}
body{position:relative;font:400 var(--size)/1.25 "Archivo Narrow",system-ui,sans-serif;color:var(--ivory);font-variant-numeric:tabular-nums;
  background:radial-gradient(60% 70% at 15% 20%,#2F6BFF 0,transparent 60%),radial-gradient(50% 60% at 90% 80%,#FF7A3D 0,transparent 60%),#20262F}
.panel{position:absolute;inset:0;border-radius:12px;overflow:hidden;display:flex;flex-direction:column;
  background:radial-gradient(80% 60% at 30% 40%,rgba(255,214,120,.95),rgba(226,169,46,.88) 55%,rgba(178,122,20,.9));backdrop-filter:blur(20px);
  border:1px solid rgba(255,240,200,.4)}
.bar{display:flex;align-items:center;gap:10px;height:50px;padding:0 14px;background:var(--carbon);color:var(--ivory)}
.q{flex:1;text-transform:uppercase;letter-spacing:.06em;font-weight:700}
.q span{font-weight:400;opacity:.7}.q i{display:inline-block;width:2px;height:15px;background:var(--bed);vertical-align:-3px}
.ic{width:28px;height:28px;display:grid;place-items:center;border:1px solid rgba(246,240,220,.35)}
.rack{flex:1;padding:14px 18px;display:flex;flex-direction:column;gap:8px}
.s{--c:var(--ivory);display:grid;grid-template-columns:38px 1fr 64px 46px;align-items:center;height:42px;background:var(--slate);
  transform:skewX(-11deg);box-shadow:inset 0 1px 0 rgba(255,255,255,.25),0 4px 10px rgba(80,50,0,.25);backdrop-filter:blur(6px)}
.s>*{transform:skewX(11deg)}
.code{height:100%;display:grid;place-items:center;font-weight:700;letter-spacing:.06em;background:rgba(0,0,0,.35)}
.s .a{padding-left:14px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;white-space:nowrap;overflow:hidden}
.s .e{text-transform:uppercase;letter-spacing:.08em}
.s .u{text-align:right;padding-right:12px}
.mark{display:inline-block;width:9px;height:9px;border:1.5px solid currentColor;margin-right:6px;vertical-align:0}
.mark.f{background:currentColor}
.prod .code{background:var(--verm);color:var(--ivory)}
.s.sel{height:84px;background:var(--ivory);color:var(--carbon);grid-template-rows:42px 42px;box-shadow:0 10px 24px rgba(80,50,0,.35)}
.s.sel .code{grid-row:1/3;background:var(--carbon);color:var(--ivory)}
.s.sel .d{grid-column:2/5;display:flex;align-items:center;gap:18px;padding-left:14px}
.s.sel .d b{font-weight:700}
.s.sel .go{margin-left:auto;margin-right:12px;padding:3px 10px;background:var(--bottle);color:var(--ivory);font-weight:700;text-transform:uppercase;letter-spacing:.06em}
.foot{height:34px;display:flex;align-items:center;gap:18px;padding:0 16px;background:var(--carbon);color:rgba(246,240,220,.92);text-transform:uppercase;letter-spacing:.06em}
.foot b{color:var(--ivory)}.foot .n{margin-left:auto}
</style></head><body>
<div class="panel">
  <div class="bar">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#F6F0DC" stroke-width="2.2"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>
    <div class="q">acme<i></i> <span>· 6 departures</span></div>
    <div class="ic"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/></svg></div>
    <div class="ic"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg></div>
    <div class="ic"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg></div>
  </div>
  <div class="rack">
    <div class="s sel">
      <span class="code">SBX</span><span class="a">Acme Retail · UAT</span><span class="e">Sandbox</span><span class="u">×48</span>
      <span class="d"><span><b>dev.team@acme-retail.com.uat</b></span><span>acmeretail--uat.sandbox</span><span class="go">↵ Open</span></span>
    </div>
    <div class="s"><span class="code">SBX</span><span class="a">Acme Retail · Fix</span><span class="e">Sandbox</span><span class="u">×31</span></div>
    <div class="s prod"><span class="code">PRD</span><span class="a"><span class="mark f" style="color:#E2452C"></span>Acme Retail · Production</span><span class="e">Prod</span><span class="u">×12</span></div>
    <div class="s"><span class="code">HUB</span><span class="a">Acme Dev Hub</span><span class="e">Dev Hub</span><span class="u">×9</span></div>
    <div class="s"><span class="code">SCR</span><span class="a"><span class="mark"></span>Acme Feature Scratch · 4 Nov</span><span class="e">Scratch</span><span class="u">×3</span></div>
  </div>
  <div class="foot"><span><b>↵</b> Open</span><span><b>Ctrl L</b> Link</span><span><b>Ctrl 1–9</b> Jump</span><span class="n">synthetic data</span></div>
</div>
</body></html>
