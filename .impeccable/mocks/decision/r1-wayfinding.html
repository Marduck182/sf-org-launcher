<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--smoke:rgba(30,30,30,.76);--edge:rgba(255,255,255,.14);--yel:#FFCC00;--ink:#111;--white:#F7F7F2;--mute:rgba(247,247,242,.8)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:620px;height:520px;overflow:hidden}
body{position:relative;font-family:"Source Sans 3",system-ui,sans-serif;color:var(--white);font-variant-numeric:tabular-nums;
  background:radial-gradient(60% 70% at 15% 20%,#2F6BFF 0,transparent 60%),radial-gradient(50% 60% at 90% 80%,#FF7A3D 0,transparent 60%),#20262F}
.win{position:absolute;border-radius:8px;background:#1E1E1E;box-shadow:0 10px 30px rgba(0,0,0,.4)}
.win i{display:block;height:6px;margin:10px 14px;border-radius:3px;background:#3A6FD8}
.win i:nth-child(2n){width:60%;background:#CE9178}
.panel{position:absolute;inset:0;border-radius:12px;background:var(--smoke);backdrop-filter:blur(24px) saturate(140%);border:1px solid var(--edge);display:flex;flex-direction:column;overflow:hidden}
.bar{display:flex;align-items:center;gap:10px;height:52px;padding:0 14px 0 16px;border-bottom:1px solid var(--edge)}
.q{flex:1;font:600 18px "Source Sans 3"}.q i{display:inline-block;width:2px;height:19px;background:var(--yel);vertical-align:-4px}
.ic{width:30px;height:30px;border-radius:6px;display:grid;place-items:center;color:var(--mute);background:rgba(255,255,255,.07)}
.list{flex:1;padding:10px;display:flex;flex-direction:column;gap:6px}
.r{display:grid;grid-template-columns:34px 1fr auto 46px;align-items:center;gap:12px;height:42px;padding:0 10px 0 4px;border-radius:6px;background:rgba(255,255,255,.04)}
.pic{width:30px;height:30px;border-radius:4px;background:#000;display:grid;place-items:center}
.pic svg{stroke:#fff}
.a{font:600 17px "Source Sans 3";white-space:nowrap;overflow:hidden}
.e{font:400 14px "Source Sans 3";color:var(--mute)}
.g{font:800 22px "Source Sans 3";text-align:right;color:var(--mute)}
.r.sel{height:76px;background:var(--yel);color:var(--ink);grid-template-columns:34px 1fr auto 60px;box-shadow:0 6px 16px rgba(0,0,0,.35)}
.r.sel .a{font-size:22px;font-weight:700}
.r.sel .e{color:#3B3200}
.r.sel .g{font-size:44px;color:var(--ink);line-height:1}
.r.sel .info{display:flex;flex-direction:column;gap:2px;min-width:0}
.r.sel .arrow{display:flex;align-items:center;gap:8px;font:700 14px "Source Sans 3"}
.prod .pic{background:#C8102E}
.foot{height:38px;display:flex;align-items:center;gap:16px;padding:0 16px;border-top:1px solid var(--edge);font:400 13px "Source Sans 3";color:var(--mute)}
.foot kbd{font:700 11px "Source Sans 3";background:var(--yel);color:var(--ink);border-radius:3px;padding:1px 6px;margin-right:5px}
.foot .n{margin-left:auto}
</style></head><body>
<div class="win" style="left:-30px;top:40px;width:380px;height:300px"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
<div class="win" style="left:330px;top:250px;width:340px;height:260px;background:#F5F5F5"><i style="background:#0B5CAB"></i><i style="background:#ccc"></i></div>
<div class="panel">
  <div class="bar">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#F7F7F2" stroke-width="2.2"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>
    <div class="q">acme<i></i></div>
    <div class="ic"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/></svg></div>
    <div class="ic"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg></div>
    <div class="ic"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg></div>
  </div>
  <div class="list">
    <div class="r sel">
      <span class="pic"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke-width="2"><path d="M9 3h6M10 3v6l-5 9a2 2 0 0 0 2 3h10a2 2 0 0 0 2-3l-5-9V3"/></svg></span>
      <span class="info"><span class="a">Acme Retail UAT</span><span class="e">Sandbox · dev.team@acme-retail.com.uat</span></span>
      <span class="arrow">Open <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#111" stroke-width="2.6"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span>
      <span class="g">1</span>
    </div>
    <div class="r"><span class="pic"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke-width="2"><path d="M9 3h6M10 3v6l-5 9a2 2 0 0 0 2 3h10a2 2 0 0 0 2-3l-5-9V3"/></svg></span><span class="a">Acme Retail Fix</span><span class="e">Sandbox</span><span class="g">2</span></div>
    <div class="r prod"><span class="pic"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke-width="2"><path d="M12 3 4 6v6c0 5 3.5 8 8 9 4.5-1 8-4 8-9V6z"/></svg></span><span class="a">Acme Retail Production</span><span class="e">Production</span><span class="g">3</span></div>
    <div class="r"><span class="pic"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke-width="2"><circle cx="12" cy="12" r="3"/><circle cx="5" cy="5" r="2"/><circle cx="19" cy="5" r="2"/><circle cx="12" cy="20" r="2"/><path d="M7 7l3 3M17 7l-3 3M12 15v3"/></svg></span><span class="a">Acme Dev Hub</span><span class="e">Dev Hub</span><span class="g">4</span></div>
    <div class="r"><span class="pic"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke-width="2"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l3 2M10 2h4"/></svg></span><span class="a">Acme Feature Scratch</span><span class="e">Scratch · 7 days left</span><span class="g">5</span></div>
    <div class="r"><span class="pic"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke-width="2"><path d="M9 3h6M10 3v6l-5 9a2 2 0 0 0 2 3h10a2 2 0 0 0 2-3l-5-9V3"/></svg></span><span class="a">Northwind Logistics QA</span><span class="e">Sandbox</span><span class="g">6</span></div>
  </div>
  <div class="foot"><span><kbd>↵</kbd>Open</span><span><kbd>Ctrl 1–9</kbd>Go to</span><span><kbd>Ctrl L</kbd>Copy link</span><span class="n">6 orgs · synthetic data</span></div>
</div>
</body></html>
